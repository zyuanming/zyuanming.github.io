  <h1>NicoComic 支持</h1>
  <p>NicoComic 是一款面向 iPhone 和 iPad 的本地优先漫画阅读器。</p>

  <h2>联系我们</h2>
  <p>如需帮助、报告问题或提出建议，请发送邮件至 <a href="mailto:zyuanming@outlook.com">zyuanming@outlook.com</a>。请附上设备型号、系统版本、文件格式和问题现象；请勿发送含密码的日志或链接。</p>

  <h2>常见检查</h2>
  <ul>
    <li>远程来源无法连接：确认地址、端口、账号权限与局域网访问权限。</li>
    <li>文件无法打开：确认文件未加密或损坏，并使用受支持的漫画或图片型电子书格式。</li>
    <li>存储占用过高：在 NicoComic 设置中打开缓存管理进行清理。</li>
  </ul>

  <h2>隐私</h2>
  <p><a href="../privacy/">查看 NicoComic 隐私政策</a></p>
